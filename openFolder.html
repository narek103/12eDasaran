<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>12Ե - Հրավեր</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #ffffff;
        font-family: 'Inter', sans-serif;
        color: #000;
        margin: 0;
        padding-bottom: 50px;
      }

      .mobile-container {
        max-width: 480px;
        margin: 0 auto;
        padding: 15px;
      }

      .main-invitation {
        text-align: center;
        padding: 30px 10px 10px;
      }

      .main-invitation h1 {
        font-weight: 200;
        font-size: 1.4rem;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .info-header {
        display: flex;
        justify-content: space-around;
        padding: 10px 0 25px;
        margin-bottom: 10px;
        border-bottom: 1px solid #f0f0f0;
      }

      .info-item { text-align: center; }
      .label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #888; }
      .value { font-size: 1.1rem; font-weight: 300; position: relative; display: block; margin-top: 5px; }
      
      .crossed::after {

        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
        opacity: 0.9;
      }

      .brick-wall {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 150px;
        gap: 10px;
        grid-auto-flow: dense; 
      }

      .photo-box {
      
        overflow: hidden;
        border-radius: 4px;
        background: #eee;
      }

      .photo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .vertical { grid-row: span 2; }
      .horizontal { grid-column: span 2; }
      .square { grid-column: span 1; grid-row: span 1; }

.disk-area {
  grid-column: span 1;
  grid-row: span 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; 
  padding-top: 0;              
  margin-top: -5px;           
}

      .disk-img {
        width: 100%;
        max-width: 150px; 
        aspect-ratio: 1/1;
        border-radius: 50%;
        animation: spin 10s linear infinite;
        filter: grayscale(100%);
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .tag-btn {
        background: #000;
        color: #fff !important;
        text-decoration: none;
        padding: 8px;
        font-size: 11px;
        margin-top: 10px;
        display: block;
        width: 100%;
        text-align: center;
        font-weight: 300;
        letter-spacing: 1px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>

    <div class="mobile-container">
      
      <div class="main-invitation">
        <h1>Հարգելի՛ ուսուցիչներ, <br> Դուք հրավիրված եք 12Ե դասարանի Վերջին դասի տոնական միջոցառմանը:</h1>
      </div>

      <div class="info-header">
        <div class="info-item">
          <div class="label">Ամսաթիվ</div>
          <span class="value crossed">Մայիսի 22</span>
        </div>


        <div class="info-item">
          <div class="label">Ժամը</div>
          <span class="value">09:20</span>
        </div>
        
        
        <div class="info-item">
          <div class="label">Դասասենյակ</div>
          <span class="value crossed">303</span>
        </div>
      </div>

      <div class="brick-wall">
        
        <div class="photo-box vertical">
          <img src="./img/class/class5.jpg" alt="">
        </div>

        <div class="photo-box square">
          <img src="./img/class/class2.jpeg" alt="">
        </div>

        <div class="disk-area">
          <img src="./img/components/disk.png" class="disk-img" alt="">
          <a href="we.html" class="tag-btn">ՄԵՆՔ</a>
        <a href="12eclass.html" class="tag-btn">12Ե ԴԱՍԱՐԱՆ</a>
        </div>

        <div class="photo-box horizontal">
          <img src="./img/class/class3.jpeg" alt="">
        </div>

        <div class="photo-box square">
          <img src="./img/class/class4.jpeg" alt="">
        </div>

      <div class="photo-box vertical">
          <img src="./img/class/class7.jpg" alt="">
        </div>
        <div class="photo-box square">
          <img src="./img/class/class1.jpeg" alt="">
        </div>

        <div class="photo-box square">
          <img src="./img/class/class8.jpeg" alt="">
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
