<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12Ե</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .card {
            width: 300px;
            height: 200px;
            background-color: #0a0a0a; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border-radius: 4px;
        }

        .triangle {
            position: absolute;
            top: 0;
            width: 100%;
            height: 60%;
            background-color: #1a1a1a; 
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 1;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .seal {
            position: relative;
            width: 70px;
            height: 70px;
            z-index: 10; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .card:active .seal {
            transform: scale(0.9); 
        }

        .circle-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .circle-2 {
            position: absolute;
            width: 85%;
            height: 85%;
            background: linear-gradient(135deg, #aa771c, #fbf5b7, #b38728, #fcf6ba, #bf953f);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .seal-inner-text {
            color: #000000; 
            font-size: 20px;
            font-weight: 300; 
            letter-spacing: 1px;
            z-index: 11;
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.3);
        }

        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <a href="openFolder.html" class="card">
        <div class="triangle"></div>
        
        <div class="seal">
            <div class="circle-1"></div>
            <div class="circle-2">
                <span class="seal-inner-text">12Ե</span>
            </div>
        </div>

        <div class="hint">Սեղմեք բացելու համար</div>
    </a>

</body>
</html>
