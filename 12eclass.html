<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>12Ե ԴԱՍԱՐԱՆ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #ffffff;
        font-family: 'Inter', sans-serif;
        padding-bottom: 50px;
      }

      .mobile-container {
        max-width: 500px; 
        margin: 0 auto;
      }

      header h1 {
        font-weight: 200;
        font-size: 1.7rem;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 5px;
        padding: 40px 0 20px;
      }

      .collage-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 150px; 
        gap: 12px;
        grid-auto-flow: dense; 
        padding: 0 10px;
      }

      .photo-card {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background: #f8f9fa;
        border: 1px solid #eee;
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover; 
        display: block;
      }

      
      .v-tall { grid-row: span 2; } 
      
      .h-wide { grid-column: span 2; }

      .big-sq { grid-column: span 2; grid-row: span 2; }

    </style>
  </head>
  <body>

    <div class="container-fluid mobile-container">
      <header>
        <h1>12Ե ԴԱՍԱՐԱՆ</h1>
      </header>

      <div class="collage-grid">
        
        <div class="photo-card v-tall">
          <img src="./img/class2/2.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card">
          <img src="./img/class2/1.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card">
          <img src="./img/class2/4.jpg" alt="Class Photo">
        </div>

        <div class="photo-card h-wide">
          <img src="./img/class2/11.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card v-tall">
          <img src="./img/class2/5.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card v-tall">
          <img src="./img/class2/10.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card v-tall">
          <img src="./img/class2/3.jpeg" alt="Class Photo">
        </div>

        <div class="photo-card">
          <img src="./img/class2/8.jpg" alt="Class Photo">
        </div>

        <div class="photo-card v-tall">
          <img src="./img/class2/6.jpg" alt="Class Photo">
        </div>

       <div class="photo-card">
          <img src="./img/class2/12.jpeg" alt="Class Photo">
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
